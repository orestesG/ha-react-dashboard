name: Deploy Panel to Home Assistant

# Compila los paneles, los copia a HA y reinicia HA (panel_custom solo lee module_url al arrancar).
# Corre en el runner propio (VM 103), que llega a la red de HA. Solo con push a main o a mano: nunca con PRs.
on:
  push:
    branches: [main]
    # Solo lo que cambia los paneles compilados o cómo se despliegan: un merge de docs no reinicia HA
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - 'tailwind.config.js'
      - 'postcss.config.js'
      - 'scripts/quiet-build.mjs'
      - 'scripts/ha-restart.mjs'
      - '.github/workflows/deploy-panel.yml'
  # A mano (Actions → Run workflow) siempre copia y reinicia, aunque el build no haya cambiado
  workflow_dispatch:

permissions:
  contents: read

# Un deploy a la vez: dos merges seguidos copiarían y reiniciarían HA al mismo tiempo.
# El segundo espera (no se cancela: trae el build más nuevo).
concurrency:
  group: deploy-panel
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # Fijadas a un commit: corren en la VM con los secrets. Dependabot propone las actualizaciones.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Restaurar las configs reales
        env:
          DASHBOARD_CONFIG_B64: ${{ secrets.DASHBOARD_CONFIG_B64 }}
          FLOORPLAN_CONFIG_B64: ${{ secrets.FLOORPLAN_CONFIG_B64 }}
        run: |
          if [ -n "$FLOORPLAN_CONFIG_B64" ]; then
            echo "$FLOORPLAN_CONFIG_B64" | base64 -d > src/floorplan.config.ts
            echo "OK: floorplan.config.ts restaurado desde secret"
          else
            cp src/floorplan.config.example.ts src/floorplan.config.ts
            echo "WARN: usando floorplan.config.example.ts (secret FLOORPLAN_CONFIG_B64 no configurado)"
          fi
          if [ -n "$DASHBOARD_CONFIG_B64" ]; then
            echo "$DASHBOARD_CONFIG_B64" | base64 -d > src/dashboard.config.ts
            echo "OK: dashboard.config.ts restaurado desde secret"
          else
            cp src/dashboard.config.example.ts src/dashboard.config.ts
            echo "WARN: usando dashboard.config.example.ts (secret DASHBOARD_CONFIG_B64 no configurado)"
          fi

      # Repo público, logs públicos: con las configs reales un error del build podría citar sus valores
      - name: Build panel (salida oculta)
        run: node scripts/quiet-build.mjs

      # Si main.js y plano.js son idénticos byte a byte a los que ya sirve HA, no hay nada que copiar ni
      # reiniciar (pasa con cambios de tests, comentarios o dependencias de desarrollo). El build es determinista.
      - name: Comparar con lo desplegado
        id: compare
        env:
          HA_WWW:        ${{ vars.HA_WWW_PATH }}
          HA_SAMBA_HOST: ${{ secrets.HA_SAMBA_HOST }}
          SAMBA_USER:    ${{ secrets.SAMBA_USER }}
          SAMBA_PASS:    ${{ secrets.SAMBA_PASS }}
        run: |
          # Share y subdirectorio del UNC path (el host se reemplaza por HA_SAMBA_HOST: NetBIOS no resuelve en Linux)
          LINUX_PATH=$(echo "$HA_WWW" | tr '\\' '/')
          HOST="$HA_SAMBA_HOST"
          if [ -z "$HOST" ]; then HOST=$(echo "$LINUX_PATH" | cut -d'/' -f3); fi
          SMB_SHARE="//$HOST/$(echo "$LINUX_PATH" | cut -d'/' -f4)"
          HA_SUBDIR=$(echo "$LINUX_PATH" | cut -d'/' -f5-)
          echo "SMB_SHARE=$SMB_SHARE" >> "$GITHUB_ENV"
          echo "HA_SUBDIR=$HA_SUBDIR" >> "$GITHUB_ENV"

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Corrida a mano: se copia y se reinicia siempre"
            exit 0
          fi
          DEPLOYED="$RUNNER_TEMP/deployed"
          rm -rf "$DEPLOYED" && mkdir -p "$DEPLOYED"
          smbclient "$SMB_SHARE" -U "$SAMBA_USER%$SAMBA_PASS" \
            -c "get $HA_SUBDIR/main.js $DEPLOYED/main.js; get $HA_SUBDIR/plano.js $DEPLOYED/plano.js" >/dev/null 2>&1 || true
          if [ -s "$DEPLOYED/main.js" ] && [ -s "$DEPLOYED/plano.js" ] \
             && cmp -s dist/main.js "$DEPLOYED/main.js" && cmp -s dist/plano.js "$DEPLOYED/plano.js"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Sin cambios: main.js y plano.js son idénticos a los de HA; no se copia ni se reinicia"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "El build cambió: se copia y se reinicia"
          fi

      - name: Copiar a HA y versionar module_url
        if: steps.compare.outputs.changed == 'true'
        env:
          SAMBA_USER: ${{ secrets.SAMBA_USER }}
          SAMBA_PASS: ${{ secrets.SAMBA_PASS }}
        run: |
          smbclient "$SMB_SHARE" -U "$SAMBA_USER%$SAMBA_PASS" \
            -c "mkdir $HA_SUBDIR; put dist/main.js $HA_SUBDIR/main.js; put dist/plano.js $HA_SUBDIR/plano.js" 2>/dev/null || \
          smbclient "$SMB_SHARE" -U "$SAMBA_USER%$SAMBA_PASS" \
            -c "put dist/main.js $HA_SUBDIR/main.js; put dist/plano.js $HA_SUBDIR/plano.js"
          echo "OK: main.js y plano.js copiados"

          # Descargar, parchear y subir configuration.yaml
          CONFIG="$RUNNER_TEMP/configuration.yaml"
          smbclient "$SMB_SHARE" -U "$SAMBA_USER%$SAMBA_PASS" -c "get configuration.yaml $CONFIG"
          SHA="${GITHUB_SHA:0:7}"
          sed -E -i "s#module_url: /local/mi-dashboard/(main|plano)\.js(\?v=[a-f0-9]+)?#module_url: /local/mi-dashboard/\1.js?v=${SHA}#" "$CONFIG"
          smbclient "$SMB_SHARE" -U "$SAMBA_USER%$SAMBA_PASS" -c "put $CONFIG configuration.yaml"
          echo "OK: module_url actualizado a ?v=$SHA"

      # panel_custom solo lee module_url al arrancar: sin reinicio las apps siguen con el ?v= viejo y su build en
      # caché. Valida la config antes; no espera a que HA vuelva.
      - name: Restart HA
        if: steps.compare.outputs.changed == 'true'
        env:
          HA_URL:   ${{ secrets.HA_URL }}
          HA_TOKEN: ${{ secrets.HA_TOKEN }}
        run: node scripts/ha-restart.mjs
